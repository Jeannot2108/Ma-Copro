<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma Copro · Blankenberge v1.9</title><style>

:9px}.metric strong{display:block;font-size:21px;margin-top:5px}footer{text-align:center;color:#64788d;padding:30px}.hidden{display:none!important}#login{max-width:470px;margin:65px auto}.topright{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#busy{font-weight:600;color:#1966a8}#message{margin:12px 0}
.direct-box{background:#f4f8fc;border:1px solid #d7e5f1;border-radius:10px;padding:13px;margin:12px 0}.direct-person{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #dce6ef;padding:9px 0;flex-wrap:wrap}.direct-person label{display:flex;align-items:center;gap:9px;margin:0}.direct-person input{width:auto;accent-color:#1966a8}</style></head><body><header><div><h1>🏢 Ma Copro</h1><small>Blankenberge · Gestion partagée des comptes</small></div><div class="topright"><select id="lang" style="width:auto" onchange="language=this.value;render()"><option value="fr">Français</option><option value="nl">Nederlands</option></select><span id="identity"></span><button id="change-password" class="secondary hidden" onclick="showPasswordForm(false)">Mot de passe / Wachtwoord</button><button id="logout" class="secondary hidden" onclick="signOut()">Déconnexion</button></div></header><main class="wrap"><div id="message"></div><section id="login" class="panel"><h2>Connexion / Aanmelden</h2><form onsubmit="signIn(event)"><label>Adresse e-mail / E-mailadres</label><input id="email" type="email" autocomplete="username" required><label style="margin-top:15px">Mot de passe / Wachtwoord</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Se connecter / Aanmelden</button></div></form><p><button type="button" class="secondary small" onclick="requestPasswordReset()">Mot de passe oublié ? / Wachtwoord vergeten?</button></p><p class="muted">Accès réservé aux copropriétaires autorisés.</p></section><section id="password-panel" class="panel hidden" style="max-width:510px;margin:50px auto"><h2 id="password-title">Changer mon mot de passe</h2><p id="password-help" class="muted"></p><form onsubmit="saveNewPassword(event)"><label>Nouveau mot de passe / Nieuw wachtwoord</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><label style="margin-top:12px">Confirmer / Bevestigen</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required><div class="actions"><button type="submit">Enregistrer / Opslaan</button><button id="cancel-password" type="button" class="secondary" onclick="hidePasswordForm()">Annuler</button></div></form></section><section id="main" class="hidden"><div class="actions"><label style="margin:0" for="year">Exercice / Boekjaar</label><select id="year" style="width:auto" onchange="year=Number(this.value);renderPanel()"></select><span id="busy"></span></div><nav id="nav"></nav><div id="panel"></div></section></main><footer>Ma Copro v1.9 · 01/09 – 31/08 · Vérifiez les décomptes avant validation</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>

const PUBLIC_KEY='sb_publishable_Sh166YmP0V3M7-8aZLgbhA_EHlI_3cz';

const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('fr-BE',{style:'currency',currency:'EUR'}),n=x=>Number(x)||0,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),dateYear=s=>Number(String(s).slice(0,4))-(Number(String(s).slice(5,7))<9?1:0),inYear=s=>dateYear(s)===year,admin=()=>role==='admin',who=k=>PEOPLE.find(p=>p.id===k)?.name||k;
function say(msg,error=false){$('message').innerHTML=msg?`<div class="notice" style="${error?'background:#ffe3e6':''}">${esc(msg)}</div>`:''}function busy(s){$('busy').textContent=s||''}function check(error){if(error)throw error}function share(owner,allocation){let p=PEOPLE.find(p=>p.id===owner);if(!p)return 0;return allocation==='garage'?(owner==='jean-marc'?1:0):allocation==='four'?(owner==='jean-marc'?0:p.share/90):p.share/100}
async function signIn(e){e.preventDefault();try{if(!sb)throw Error('La bibliothèque Supabase ne s’est pas chargée. Vérifiez votre connexion Internet.');let {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});check(error);$('password').value='';await start()}catch(err){say(err.message,true)}}
function showPasswordForm(recovery=false){recoveryMode=!!recovery;passwordPanelOpen=true;$('login').classList.add('hidden');$('main').classList.add('hidden');$('password-panel').classList.remove('hidden');$('password-title').textContent=recovery?'Définir un nouveau mot de passe / Nieuw wachtwoord instellen':'Changer mon mot de passe / Wachtwoord wijzigen';$('password-help').textContent=recovery?'Lien de réinitialisation reconnu. Choisissez un nouveau mot de passe (12 caractères minimum).':'Choisissez un nouveau mot de passe (12 caractères minimum).';$('cancel-password').classList.toggle('hidden',recovery);say('')}
function hidePasswordForm(){if(recoveryMode)return;passwordPanelOpen=false;$('password-panel').classList.add('hidden');start()}
async function saveNewPassword(e){e.preventDefault();const pass=$('new-password').value;if(pass!==$('confirm-password').value)return say('Les deux mots de passe ne correspondent pas.',true);if(pass.length<12)return say('Utilisez au moins 12 caractères.',true);try{const r=await sb.auth.updateUser({password:pass});check(r.error);$('new-password').value='';$('confirm-password').value='';recoveryMode=false;passwordPanelOpen=false;$('password-panel').classList.add('hidden');history.replaceState(null,'',location.pathname);await start();say('Mot de passe modifié avec succès.')}catch(err){say('Modification impossible : '+err.message,true)}}
async function requestPasswordReset(){const email=$('email').value.trim();if(!email)return say('Indiquez d’abord votre adresse e-mail dans le formulaire.',true);try{const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://jeannot2108.github.io/Ma-Copro/'});check(r.error);say('Si ce compte existe, un e-mail de réinitialisation sera envoyé. Consultez aussi les courriers indésirables.')}catch(err){say('Demande impossible : '+err.message,true)}}
async function signOut(){await sb.auth.signOut();role='reader';profile='';$('login').classList.remove('hidden');$('main').classList.add('hidden');$('logout').classList.add('hidden');$('change-password').classList.add('hidden');$('identity').textContent='';say('')}
async function start(){if(recoveryMode||passwordPanelOpen)return;try{const {data:{user},error}=await sb.auth.getUser();check(error);if(!user){$('login').classList.remove('hidden');return}const p=await sb.from('profiles').select('role,display_name').eq('user_id',user.id).single();check(p.error);role=p.data.role;profile=p.data.display_name;$('identity').textContent=`${profile} · ${role}`;$('logout').classList.remove('hidden');$('change-password').classList.remove('hidden');$('login').classList.add('hidden');$('main').classList.remove('hidden');$('year').innerHTML=Array.from({length:15},(_,i)=>2020+i).map(y=>`<option value="${y}">${y}–${y+1} (01/09–31/08)</option>`).join('');$('year').value=year;await refresh()}catch(err){say('Connexion impossible : '+err.message,true)}}
async function refresh(){busy('Synchronisation…');try{for(const table of Object.keys(data)){let r=await sb.from(table).select('*');check(r.error);data[table]=r.data}say('');render()}catch(err){say('Erreur de synchronisation : '+err.message,true)}finally{busy('')}}
function render(){const tabs=['electricity','water','fire','divers','quotes','reports','assemblies'];$('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';editing=null;render()">${T[language][i]}</button>`).join('');renderPanel()}
function renderPanel(){let out=tab==='electricity'?electricityPanel():['water','fire','divers'].includes(tab)?expensesPanel():tab==='quotes'?quotesPanel():tab==='assemblies'?assembliesPanel():reportsPanel();$('panel').innerHTML=out}
const opts=(items,selected)=>items.map(([v,label])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(label)}</option>`).join('');const owners=selected=>opts(PEOPLE.map(p=>[p.id,p.name]),selected);const paymentModes=selected=>opts([['advance','Avance par un copropriétaire / Voorschot door mede-eigenaar'],['direct','Paiement direct au fournisseur / Rechtstreeks aan leverancier']],selected);const directMode=x=>x.payment_mode==='direct';const directPaid=x=>x.direct_paid||{};const alloc=selected=>opts([['all','5 copropriétaires / 5 mede-eigenaars'],['four','4 copropriétaires hors garage / zonder garage'],['garage','Garage uniquement / alleen garage']],selected);
const docs=({expense_id=null,electricity_id=null,quote_id=null})=>{let found=data.documents.filter(d=>expense_id?d.expense_id===expense_id:electricity_id?d.electricity_id===electricity_id:d.quote_id===quote_id);return found.map(d=>`<span class="doc">📎 ${esc(d.file_name)} <button class="small secondary" onclick="openDoc('${d.id}')">Ouvrir / Openen</button>${admin()?`<button class="small danger" onclick="deleteDoc('${d.id}')">×</button>`:''}</span>`).join('')||'<span class="muted">Aucun document / Geen document</span>'};
function uploadWidget(type,ref){return admin()?`<div class="actions"><input style="max-width:330px" type="file" id="file-${ref}" multiple accept=".pdf,.jpg,.jpeg,.png"><button class="secondary" onclick="upload('${type}','${ref}')">Joindre des documents / Documenten toevoegen</button></div><p class="muted">PDF, JPG, PNG · 10 Mo maximum par fichier.</p>`:''}
function expensesPanel(){const cat=tab==='water'?'water':tab==='fire'?'fire':'divers',list=data.expenses.filter(x=>x.category===cat&&inYear(x.expense_date)),e=editing?list.find(x=>x.id===editing)||{}:{};let title=T[language][['water','fire','divers'].indexOf(tab)+1];let form=admin()?`<section class="panel"><h2>${editing?'Modifier / Wijzigen':'Ajouter / Toevoegen'} · ${title}</h2><form onsubmit="saveExpense(event)"><div class="fields"><div><label>Date / Datum</label><input type="date" name="date" required value="${esc(e.expense_date||`${year+1}-08-01`)}"></div><div><label>Objet / Omschrijving</label><input name="title" required value="${esc(e.title||'')}"></div><div><label>Montant TTC / Bedrag incl. btw (€)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${e.amount_ttc??''}"></div><div><label>Payé par / Betaald door</label><select name="payer">${owners(e.paid_by||'jean')}</select></div><div><label>Mode de paiement / Betalingswijze</label><select name="payment_mode">${paymentModes(e.payment_mode||'advance')}</select></div><div><label>Répartition / Verdeling</label><select name="allocation">${alloc(e.allocation||(cat==='fire'?'four':'all'))}</select></div>${cat==='divers'?`<div><label>Catégorie / Categorie</label><select name="subcategory">${opts(['Travaux','Assurance','Entretien','Administration','Consommations','Autre'].map(x=>[x,x]),e.subcategory||'Autre')}</select></div>`:''}</div><label>Remarques / Opmerkingen</label><textarea name="notes">${esc(e.notes||'')}</textarea><div class="actions"><button>${editing?'Enregistrer':'Ajouter la dépense'}</button>${editing?'<button type="button" class="secondary" onclick="editing=null;renderPanel()">Annuler</button>':''}</div></form></section>`:'';
let rows=PEOPLE.map(p=>({name:p.name,amount:list.reduce((s,x)=>s+n(x.amount_ttc)*share(p.id,x.allocation),0)}));return form+`<section class="panel"><h2>${title} · ${fmt(list.reduce((s,x)=>s+n(x.amount_ttc),0))}</h2>${summary(rows)}${list.map(x=>`<div style="border-top:1px solid #e4ebf2;padding:14px 0"><strong>${esc(x.title)}</strong> · ${esc(x.expense_date)} · ${fmt(x.amount_ttc)}<p class="muted">${directMode(x)?'Paiement direct au fournisseur / Rechtstreeks aan leverancier':'Avancé par / Voorgeschoten door : '+esc(who(x.paid_by))} · ${esc(x.subcategory||'')} · ${esc(x.notes||'')}</p>${directMode(x)?directPaymentWidget(x):''}${docs({expense_id:x.id})}${uploadWidget('expense_id',x.id)}${admin()?`<div class="actions"><button class="secondary small" onclick="editing='${x.id}';renderPanel()">Modifier</button><button class="danger small" onclick="removeRow('expenses','${x.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class="muted">Aucune dépense / Geen uitgaven</p>'}</section>`}
function directPaymentWidget(x){const paid=directPaid(x),people=PEOPLE.filter(p=>share(p.id,x.allocation)>0),done=people.reduce((v,p)=>v+(paid[p.id]?n(x.amount_ttc)*share(p.id,x.allocation):0),0);return `<div class="direct-box"><strong>Paiements directs / Rechtstreekse betalingen</strong><p class="muted">Chaque copropriétaire règle sa part au fournisseur. Seul l’administrateur peut confirmer un paiement.</p>${people.map(p=>`<div class="direct-person"><label><input type="checkbox" ${paid[p.id]?'checked':''} ${admin()?`onchange="setDirectPaid('${x.id}','${p.id}',this.checked)"`:'disabled'}> ${esc(p.name)}</label><span>${fmt(n(x.amount_ttc)*share(p.id,x.allocation))} · ${paid[p.id]?'Payé / Betaald':'À payer / Te betalen'}</span></div>`).join('')}<p><strong>Payé : ${fmt(done)}</strong> · Reste à payer au fournisseur : ${fmt(n(x.amount_ttc)-done)}</p></div>`}
async function setDirectPaid(expenseId,ownerId,checked){if(!admin())return;const x=data.expenses.find(e=>e.id===expenseId);if(!x||!directMode(x)||share(ownerId,x.allocation)===0)return;const updated={...directPaid(x),[ownerId]:checked};busy('Enregistrement du paiement…');try{const r=await sb.from('expenses').update({direct_paid:updated}).eq('id',expenseId).select('id');check(r.error);if(!r.data?.length)throw Error('Modification non autorisée.');await refresh()}catch(e){say('Impossible de modifier le paiement : '+e.message,true);renderPanel()}finally{busy('')}}
function summary(rows){return `<div class="summary">${rows.map(r=>`<div class="metric">${esc(r.name)}<strong>${fmt(r.amount)}</strong></div>`).join('')}</div>`}
async function saveExpense(ev){ev.preventDefault();let f=ev.target,v=Object.fromEntries(new FormData(f));if(!inYear(v.date))return say('Date hors exercice.',true);let row={expense_date:v.date,title:v.title,amount_ttc:n(v.amount),paid_by:v.payer,allocation:v.allocation,category:tab==='water'?'water':tab==='fire'?'fire':'divers',subcategory:v.subcategory||null,notes:v.notes||null,payment_mode:v.payment_mode,direct_paid:editing?(data.expenses.find(x=>x.id===editing)?.direct_paid||{}):{}};await write('expenses',row,editing)}
function electricityPanel(){let list=data.electricity_statements.filter(x=>inYear(x.statement_date)),e=editing?list.find(x=>x.id===editing)||{}:{};let form=admin()?`<section class="panel"><h2>${editing?'Modifier':'Ajouter'} un décompte électrique / Elektriciteitsafrekening</h2><p class="muted">Total annuel TTC = acomptes + régularisation. Le coût de chaque décompteur est calculé séparément par règle de trois.</p><form onsubmit="saveElectricity(event)"><div class="fields"><div><label>Date de régularisation</label><input type="date" name="date" required value="${esc(e.statement_date||`${year+1}-08-15`)}"></div><div><label>Acomptes annuels (€)</label><input type="number" name="advances" step="0.01" min="0" required value="${e.annual_total_ttc??''}"></div><div><label>Régularisation (+ / −) (€)</label><input type="number" name="adjustment" step="0.01" required value="0"></div><div><label>Consommation totale facture (kWh)</label><input type="number" name="total" step="0.001" min="0.001" required value="${e.total_kwh??''}"></div><div><label>Décompteur communs (kWh)</label><input type="number" name="common" step="0.001" min="0" required value="${e.common_kwh??''}"></div><div><label>Décompteur garage (kWh)</label><input type="number" name="garage" step="0.001" min="0" required value="${e.garage_kwh??''}"></div></div><label>Remarques</label><textarea name="notes">${esc(e.notes||'')}</textarea><div class="actions"><button>Enregistrer / Opslaan</button>${editing?'<button type="button" class="secondary" onclick="editing=null;renderPanel()">Annuler</button>':''}</div></form></section>`:'';
let rows=PEOPLE.map(p=>({name:p.name,amount:list.reduce((s,x)=>s+(n(x.annual_total_ttc)*n(x.common_kwh)/n(x.total_kwh))*share(p.id,'four')+(p.id==='jean-marc'?n(x.annual_total_ttc)*n(x.garage_kwh)/n(x.total_kwh):0),0)}));return form+`<section class="panel"><h2>Électricité / Elektriciteit</h2>${summary(rows)}${list.map(x=>`<div style="padding:15px 0;border-top:1px solid #ddd"><strong>${esc(x.statement_date)}</strong> · Facture TTC ${fmt(x.annual_total_ttc)} · ${x.total_kwh} kWh<p>Communs ${x.common_kwh} kWh = ${fmt(n(x.annual_total_ttc)*n(x.common_kwh)/n(x.total_kwh))} · Garage ${x.garage_kwh} kWh = ${fmt(n(x.annual_total_ttc)*n(x.garage_kwh)/n(x.total_kwh))}</p>${docs({electricity_id:x.id})}${uploadWidget('electricity_id',x.id)}${admin()?`<div class="actions"><button class="secondary small" onclick="editing='${x.id}';renderPanel()">Modifier</button><button class="danger small" onclick="removeRow('electricity_statements','${x.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class="muted">Aucun décompte / Geen afrekening</p>'}</section>`}
async function saveElectricity(ev){ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target)),total=n(v.total),common=n(v.common),garage=n(v.garage),annual=n(v.advances)+n(v.adjustment);if(!inYear(v.date)||annual<0||total<=0||common<0||garage<0||common+garage>total)return say('Vérifiez les dates, montants et consommations.',true);let row={statement_date:v.date,period_start:`${year}-09-01`,period_end:`${year+1}-08-31`,annual_total_ttc:annual,total_kwh:total,common_kwh:common,garage_kwh:garage,paid_by:'jean',notes:v.notes||null};await write('electricity_statements',row,editing)}
function quotesPanel(){let list=data.quotes.filter(x=>inYear(x.received_date)),e=editing?list.find(x=>x.id===editing)||{}:{};let form=admin()?`<section class="panel"><h2>Devis à valider / Offertes ter goedkeuring</h2><form onsubmit="saveQuote(event)"><div class="fields"><div><label>Date</label><input type="date" name="date" required value="${esc(e.received_date||`${year+1}-08-01`)}"></div><div><label>Entreprise / Onderneming</label><input name="vendor" required value="${esc(e.vendor||'')}"></div><div><label>Objet / Onderwerp</label><input name="title" required value="${esc(e.title||'')}"></div><div><label>Montant TTC (€)</label><input name="amount" type="number" min="0" step="0.01" required value="${e.amount_ttc??''}"></div><div><label>Statut / Status</label><select name="status">${opts([['pending','À examiner'],['approved','Approuvé'],['rejected','Refusé'],['postponed','Reporté']],e.status||'pending')}</select></div></div><label>Remarques</label><textarea name="notes">${esc(e.notes||'')}</textarea><div class="actions"><button>Enregistrer</button>${editing?'<button type="button" class="secondary" onclick="editing=null;renderPanel()">Annuler</button>':''}</div></form></section>`:'';return form+`<section class="panel"><h2>Devis / Offertes (${list.length})</h2><p class="muted">Les devis ne sont pas comptabilisés comme dépenses.</p>${list.map(x=>`<div style="border-top:1px solid #ddd;padding:15px 0"><strong>${esc(x.title)}</strong> · ${fmt(x.amount_ttc)} · ${esc(x.status)}<p>${esc(x.vendor)} · ${esc(x.received_date)} · ${esc(x.notes||'')}</p>${docs({quote_id:x.id})}${uploadWidget('quote_id',x.id)}${admin()?`<div class="actions"><button class="secondary small" onclick="editing='${x.id}';renderPanel()">Modifier</button><button class="danger small" onclick="removeRow('quotes','${x.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class="muted">Aucun devis / Geen offertes</p>'}</section>`}
async function saveQuote(ev){ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target));if(!inYear(v.date))return say('Date hors exercice.',true);await write('quotes',{received_date:v.date,vendor:v.vendor,title:v.title,amount_ttc:n(v.amount),status:v.status,notes:v.notes||null},editing)}
function paymentsPanel(){let list=data.settlements.filter(x=>inYear(x.payment_date));return (admin()?`<section class="panel"><h2>Enregistrer un remboursement / Terugbetaling registreren</h2><form onsubmit="savePayment(event)"><div class="fields"><div><label>Date</label><input type="date" name="date" required value="${year+1}-08-31"></div><div><label>De / Van</label><select name="from">${owners('suzanne')}</select></div><div><label>Vers / Naar</label><select name="to">${owners('jean')}</select></div><div><label>Montant (€)</label><input type="number" name="amount" min="0.01" step="0.01" required></div></div><label>Remarques</label><textarea name="notes"></textarea><div class="actions"><button>Enregistrer</button></div></form></section>`:'')+`<section class="panel"><h2>Remboursements / Terugbetalingen</h2>${list.map(x=>`<p>${esc(x.payment_date)} · ${esc(who(x.from_owner))} → ${esc(who(x.to_owner))} · <strong>${fmt(x.amount)}</strong> ${admin()?`<button class="danger small" onclick="removeRow('settlements','${x.id}')">Supprimer</button>`:''}</p>`).join('')||'<p class="muted">Aucun remboursement</p>'}</section>`}
async function savePayment(ev){ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target));if(!inYear(v.date)||v.from===v.to||(v.from!=='jean'&&v.to!=='jean'))return say('Les remboursements doivent passer par Jean-Noël, entre deux copropriétaires distincts.',true);await write('settlements',{payment_date:v.date,from_owner:v.from,to_owner:v.to,amount:n(v.amount),notes:v.notes||null})}
function ledger(){let rows=PEOPLE.map(p=>({...p,owed:0,advanced:0,paid:0}));for(const x of data.expenses.filter(x=>inYear(x.expense_date)&&!directMode(x))){let payer=rows.find(r=>r.id===x.paid_by);if(payer)payer.advanced+=n(x.amount_ttc);for(let r of rows)r.owed+=n(x.amount_ttc)*share(r.id,x.allocation)}for(const x of data.electricity_statements.filter(x=>inYear(x.statement_date))){let total=n(x.annual_total_ttc),common=total*n(x.common_kwh)/n(x.total_kwh),garage=total*n(x.garage_kwh)/n(x.total_kwh);rows[0].advanced+=common+garage;for(let r of rows)r.owed+=common*share(r.id,'four')+(r.id==='jean-marc'?garage:0)}for(const x of data.settlements.filter(x=>inYear(x.payment_date))){let from=rows.find(r=>r.id===x.from_owner),to=rows.find(r=>r.id===x.to_owner);if(from)from.paid+=n(x.amount);if(to)to.paid-=n(x.amount)}return rows.map(r=>({...r,balance:r.advanced-r.owed+r.paid}))}
function reportsPanel(){let rows=ledger(),others=rows.filter(r=>r.id!=='jean'),direct=data.expenses.filter(x=>inYear(x.expense_date)&&directMode(x)),directTotals=PEOPLE.map(p=>({name:p.name,due:direct.reduce((v,x)=>v+n(x.amount_ttc)*share(p.id,x.allocation),0),paid:direct.reduce((v,x)=>v+(directPaid(x)[p.id]?n(x.amount_ttc)*share(p.id,x.allocation):0),0)}));return `<section class="panel"><h2>Décompte final / Eindafrekening · ${year}–${year+1}</h2><div class="tablewrap"><table><thead><tr><th>Copropriétaire</th><th class="num">Charges</th><th class="num">Avances payées</th><th class="num">Règlements</th><th class="num">Solde</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)} (${r.share} %)</td><td class="num">${fmt(r.owed)}</td><td class="num">${fmt(r.advanced)}</td><td class="num">${fmt(r.paid)}</td><td class="num">${fmt(r.balance)}</td></tr>`).join('')}</tbody></table></div><h2 style="margin-top:25px">Règlements via Jean-Noël / Betalingen via Jean-Noël</h2>${others.map(r=>`<p>${r.balance<-.005?`${esc(r.name)} → Jean-Noël`:`Jean-Noël → ${esc(r.name)}`} : <strong>${fmt(Math.abs(r.balance))}</strong>${Math.abs(r.balance)<.005?' (soldé)':''}</p>`).join('')}<p class="muted">Les soldes à régler via Jean-Noël excluent les factures payables directement au fournisseur. Les devis sont exclus.</p>${direct.length?`<h2 style="margin-top:25px">Paiements directs aux fournisseurs / Rechtstreekse betalingen</h2><div class="tablewrap"><table><thead><tr><th>Copropriétaire</th><th class="num">Part à payer</th><th class="num">Payé</th><th class="num">Reste au fournisseur</th></tr></thead><tbody>${directTotals.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${fmt(r.due)}</td><td class="num">${fmt(r.paid)}</td><td class="num">${fmt(r.due-r.paid)}</td></tr>`).join('')}</tbody></table></div><p class="muted">Ces sommes sont suivies séparément et ne constituent pas des remboursements à Jean-Noël.</p>`:''}<button class="secondary" onclick="window.print()">Imprimer / PDF</button></section>${paymentsPanel()}`}

function assembliesPanel(){
 const nl=language==='nl', list=[...data.assembly_minutes].sort((a,b)=>b.meeting_date.localeCompare(a.meeting_date)||b.created_at.localeCompare(a.created_at));
 const form=admin()?`<section class="panel"><h2>${nl?'Verslag van een algemene vergadering toevoegen':'Ajouter un compte rendu d’assemblée générale'}</h2><form onsubmit="saveAssembly(event)"><div class="fields"><div><label>${nl?'Datum van de vergadering':'Date de l’assemblée'}</label><input type="date" name="date" required></div><div><label>${nl?'Verslag (PDF)':'Compte rendu (PDF)'}</label><input type="file" name="file" accept=".pdf,application/pdf" required></div></div><p class="muted">PDF · 10 Mo maximum. ${nl?'Alleen de beheerder kan bestanden toevoegen of verwijderen.':'Seul l’administrateur peut ajouter ou supprimer des documents.'}</p><div class="actions"><button>${nl?'Verslag toevoegen':'Ajouter le compte rendu'}</button></div></form></section>`:'';
 return form+`<section class="panel"><h2>${nl?'Verslagen van algemene vergaderingen':'Comptes rendus des assemblées générales'}</h2><p class="muted">${nl?'Archief van alle boekjaren':'Archives de toutes les années, indépendamment de l’exercice comptable.'}</p>${list.map(x=>`<div style="border-top:1px solid #e4ebf2;padding:14px 0"><strong>${esc(x.meeting_date.split('-').reverse().join('/'))}</strong> · 📄 ${esc(x.file_name)}<div class="actions"><button class="secondary small" onclick="openAssembly('${x.id}')">${nl?'Openen / Downloaden':'Ouvrir / Télécharger'}</button>${admin()?`<button class="danger small" onclick="deleteAssembly('${x.id}')">${nl?'Verwijderen':'Supprimer'}</button>`:''}</div></div>`).join('')||`<p class="muted">${nl?'Nog geen verslagen.':'Aucun compte rendu enregistré.'}</p>`}</section>`;
}
async function saveAssembly(ev){ev.preventDefault();if(!admin())return;const f=ev.target.elements.file.files[0],date=ev.target.elements.date.value;if(!f||!date)return;if(f.size>10485760||f.size===0||!(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')))return say('PDF uniquement, de 1 octet à 10 Mo.',true);busy('Envoi du compte rendu…');let path=null;try{path=`assembly-minutes/${id()}.pdf`;check((await sb.storage.from('copro-documents').upload(path,f,{contentType:'application/pdf',upsert:false})).error);let r=await sb.from('assembly_minutes').insert({meeting_date:date,file_name:f.name,storage_path:path});check(r.error);await refresh()}catch(e){if(path)await sb.storage.from('copro-documents').remove([path]);say('Envoi impossible : '+e.message,true)}finally{busy('')}}
async function openAssembly(key){const x=data.assembly_minutes.find(v=>v.id===key);if(!x)return;try{let r=await sb.storage.from('copro-documents').createSignedUrl(x.storage_path,120);check(r.error);window.open(r.data.signedUrl,'_blank','noopener')}catch(e){say('Document inaccessible : '+e.message,true)}}
async function deleteAssembly(key){if(!admin()||!confirm('Supprimer définitivement ce compte rendu ?'))return;const x=data.assembly_minutes.find(v=>v.id===key);if(!x)return;busy('Suppression…');try{check((await sb.from('assembly_minutes').delete().eq('id',key)).error);const r=await sb.storage.from('copro-documents').remove([x.storage_path]);if(r.error)say('Compte rendu supprimé, mais fichier à nettoyer : '+r.error.message,true);await refresh()}catch(e){say('Suppression impossible : '+e.message,true)}finally{busy('')}}

async function write(table,row,edit){if(!admin())return say('Accès en lecture seule.',true);busy('Enregistrement…');try{let q=edit?sb.from(table).update(row).eq('id',edit):sb.from(table).insert(row);let r=await q.select();check(r.error);editing=null;await refresh()}catch(err){say('Enregistrement impossible : '+err.message,true)}finally{busy('')}}
async function removeRow(table,key){if(!admin()||!confirm('Supprimer définitivement cet élément et ses pièces jointes ?'))return;busy('Suppression…');try{let linked=table==='expenses'?'expense_id':table==='electricity_statements'?'electricity_id':table==='quotes'?'quote_id':null;if(linked){for(const d of data.documents.filter(d=>d[linked]===key)){check((await sb.storage.from('copro-documents').remove([d.storage_path])).error)}}check((await sb.from(table).delete().eq('id',key)).error);await refresh()}catch(e){say('Suppression impossible : '+e.message,true)}finally{busy('')}}
async function upload(type,ref){if(!admin())return;let input=$(`file-${ref}`),files=[...input.files];if(!files.length)return say('Choisissez un fichier.',true);busy('Envoi des documents…');try{for(const f of files){if(f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type))throw Error('PDF, JPG, PNG uniquement, maximum 10 Mo.');let key=`${type}/${ref}/${id()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;check((await sb.storage.from('copro-documents').upload(key,f,{contentType:f.type,upsert:false})).error);let r=await sb.from('documents').insert({file_name:f.name,storage_path:key,mime_type:f.type,size_bytes:f.size,[type]:ref});if(r.error){await sb.storage.from('copro-documents').remove([key]);throw r.error}}await refresh()}catch(e){say('Envoi impossible : '+e.message,true)}finally{busy('')}}
async function openDoc(docid){let d=data.documents.find(x=>x.id===docid);if(!d)return;try{let r=await sb.storage.from('copro-documents').createSignedUrl(d.storage_path,120);check(r.error);window.open(r.data.signedUrl,'_blank','noopener')}catch(e){say('Document inaccessible : '+e.message,true)}}
async function deleteDoc(docid){if(!admin()||!confirm('Supprimer ce document ?'))return;let d=data.documents.find(x=>x.id===docid);try{check((await sb.storage.from('copro-documents').remove([d.storage_path])).error);check((await sb.from('documents').delete().eq('id',docid)).error);await refresh()}catch(e){say('Suppression impossible : '+e.message,true)}}
if(!sb)say('Impossible de charger Supabase. Une connexion Internet est nécessaire.',true);
else {
  // Supabase émet PASSWORD_RECOVERY après validation du lien e-mail.
  const recoveryInUrl=location.hash.includes('type=recovery')||new URLSearchParams(location.search).get('type')==='recovery';
  if(recoveryInUrl){recoveryMode=true;showPasswordForm(true)}
  sb.auth.onAuthStateChange((event)=>{
    if(event==='PASSWORD_RECOVERY'){showPasswordForm(true)}
    // Ne jamais ouvrir l'application automatiquement pendant une réinitialisation.
  });
  if(!recoveryInUrl)start();
}
</script></body></html>
