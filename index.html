const $=id=>document.getElementById(id),fmt=n=>(Math.round((Number(n)||0)*100)/100 || 0).toLocaleString('fr-BE',{style:'currency',currency:'EUR'}),n=x=>Number(x)||0,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),dateYear=s=>Number(String(s).slice(0,4))-(Number(String(s).slice(5,7))<9?1:0),inYear=s=>dateYear(s)===year,admin=()=>role==='admin',who=k=>PEOPLE.find(p=>p.id===k)?.name||k;

async function refresh(){busy('Synchronisation…');try{for(const table of Object.keys(data)){let r=await sb.from(table).select('*');check(r.error);data[table]=r.data}say('');render()}catch(err){say('Erreur de synchronisation : '+err.message,true)}finally{busy('')}}
function render(){const tabs=['electricity','water','fire','divers','quotes','reports','assemblies'];$('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';editing=null;render()">${T[language][i]}</button>`).join('');renderPanel()}

const opts=(items,selected)=>items.map(([v,label])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(label)}</option>`).join('');const owners=selected=>opts(PEOPLE.map(p=>[p.id,p.name]),selected);const paymentModes=selected=>opts([['advance','Avance par un copropriétaire / Voorschot door mede-eigenaar'],['direct','Paiement direct au fournisseur / Rechtstreeks aan leverancier']],selected);const directMode=x=>x.payment_mode==='direct';const directPaid=x=>x.direct_paid||{};const alloc=selected=>opts([['all','5 copropriétaires / 5 mede-eigenaars'],['four','4 copropriétaires hors garage / zonder garage'],['garage','Garage uniquement / alleen garage']],selected);
const docs=({expense_id=null,electricity_id=null,quote_id=null})=>{let found=data.documents.filter(d=>expense_id?d.expense_id===expense_id:electricity_id?d.electricity_id===electricity_id:d.quote_id===quote_id);return found.map(d=>`<span class="doc">📎 ${esc(d.file_name)} <button class="small secondary" onclick="openDoc('${d.id}')">Ouvrir / Openen</button>${admin()?`<button class="small danger" onclick="deleteDoc('${d.id}')">×</button>`:''}</span>`).join('')||'<span class="muted">Aucun document / Geen document</span>'};

function expensesPanel(){const cat=tab==='water'?'water':tab==='fire'?'fire':'divers',list=data.expenses.filter(x=>x.category===cat&&inYear(x.expense_date)),e=editing?list.find(x=>x.id===editing)||{}:{};let title=T[language][['water','fire','divers'].indexOf(tab)+1];let form=admin()?`<section class="panel"><h2>${editing?'Modifier / Wijzigen':'Ajouter / Toevoegen'} · ${title}</h2><form onsubmit="saveExpense(event)"><div class="fields"><div><label>Date / Datum</label><input type="date" name="date" required value="${esc(e.expense_date||todayLocal())}"></div><div><label>Objet / Omschrijving</label><input name="title" required value="${esc(e.title||'')}"></div><div><label>Montant TTC / Bedrag incl. btw (€)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${e.amount_ttc??''}"></div><div class="payer-field" ${directMode(e)?'style="display:none"':''}><label>Payé par / Betaald door</label><select name="payer">${owners(e.paid_by||'jean')}</select></div><div><label>Mode de paiement / Betalingswijze</label><select name="payment_mode" onchange="toggleExpensePayer(this.form)">${paymentModes(e.payment_mode||'advance')}</select></div><div><label>Répartition / Verdeling</label><select name="allocation">${alloc(editing?(e.allocation||'all'):(cat==='fire'?'four':'all'))}</select>${cat==='water'&&!editing?'<small class="muted">Par défaut : les 5 copropriétaires (100 % des quotités).</small>':''}</div>${cat==='divers'?`<div><label>Catégorie / Categorie</label><select name="subcategory">${opts(['Travaux','Assurance','Entretien','Administration','Consommations','Autre'].map(x=>[x,x]),e.subcategory||'Autre')}</select></div>`:''}</div><label>Remarques / Opmerkingen</label><textarea name="notes">${esc(e.notes||'')}</textarea><div class="new-attachments"><label>${language==='nl'?'Documenten toevoegen (optioneel)':'Joindre des documents (facultatif)'}</label><input type="file" name="new_documents" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg, function directPaymentWidget(x){const paid=directPaid(x),people=PEOPLE.filter(p=>share(p.id,x.allocation)>0),done=people.reduce((v,p)=>v+(paid[p.id]?n(x.amount_ttc)*share(p.id,x.allocation):0),0);return `<details class="direct-box"><summary style="cursor:pointer;font-weight:700">${language==='nl'?'Rechtstreekse betalingen':'Paiements directs'} <span style="font-weight:400;font-size:.9em;float:right">${language==='nl'?'Betaald':'Payé'} : ${fmt(done)} · ${language==='nl'?'Nog te betalen':'Reste à payer'} : ${fmt(n(x.amount_ttc)-done)}</span></summary><div style="clear:both;padding-top:10px"><p class="muted">${language==='nl'?'Elke mede-eigenaar betaalt zijn aandeel rechtstreeks aan de leverancier. Alleen de beheerder kan een betaling bevestigen.':'Chaque copropriétaire règle sa part au fournisseur. Seul l’administrateur peut confirmer un paiement.'}</p>${people.map(p=>`<div class="direct-person"><label><input type="checkbox" ${paid[p.id]?'checked':''} ${admin()?`onchange="setDirectPaid('${x.id}','${p.id}',this.checked)"`:'disabled'}> ${esc(p.name)}</label><span>${fmt(n(x.amount_ttc)*share(p.id,x.allocation))} · ${paid[p.id]?(language==='nl'?'Betaald':'Payé'):(language==='nl'?'Te betalen':'À payer')}</span></div>`).join('')}</div></details>`}

// Monetary calculations use integer cents. The final cent is assigned by
// largest remainder, so individual allocations always sum to the invoice.
const cents=v=>Math.round((Number(v)||0)*100);
const euros=v=>v/100;
function allocateCents(amount,allocation){
 const total=cents(amount),weights=PEOPLE.map(p=>share(p.id,allocation));
 const weightSum=weights.reduce((a,b)=>a+b,0);
 if(!weightSum)return PEOPLE.map(()=>0);
 const raw=weights.map(w=>total*w/weightSum);
 const parts=raw.map(v=>Math.floor(v));
 let remaining=total-parts.reduce((a,b)=>a+b,0);
 const priority=raw.map((v,i)=>({i,frac:v-parts[i]})).sort((a,b)=>b.frac-a.frac||a.i-b.i);
 for(let j=0;j<remaining;j++)parts[priority[j%priority.length].i]++;
 return parts;
}
function ledger(){
 let rows=PEOPLE.map(p=>({...p,owed:0,advanced:0,paid:0}));
 for(const x of data.expenses.filter(x=>inYear(x.expense_date)&&!directMode(x))){
  const payer=rows.find(r=>r.id===x.paid_by),amount=cents(x.amount_ttc);
  if(payer)payer.advanced+=amount;
  const shares=allocateCents(x.amount_ttc,x.allocation);
  rows.forEach((r,i)=>r.owed+=shares[i]);
 }
 for(const x of data.electricity_statements.filter(x=>inYear(x.statement_date))){
  const total=cents(x.annual_total_ttc),kwh=n(x.total_kwh);
  if(!kwh)continue;
  const common=Math.round(total*n(x.common_kwh)/kwh),garage=Math.round(total*n(x.garage_kwh)/kwh);
  rows[0].advanced+=common+garage;
  const shares=allocateCents(euros(common),'four');
  rows.forEach((r,i)=>r.owed+=shares[i]+(r.id==='jean-marc'?garage:0));
 }
 for(const x of data.settlements.filter(x=>settlementYear(x)===year)){
  const from=rows.find(r=>r.id===x.from_owner),to=rows.find(r=>r.id===x.to_owner),amount=cents(x.amount);
  if(from)from.paid+=amount;
  if(to)to.paid-=amount;
 }
 // Reconcile the historical one-cent rounding remainder at the clearing owner,
 // without rewriting stored payments or changing other owners' settled status.
 const jean=rows.find(r=>r.id==='jean');
 if(jean){
  const balance=r=>r.advanced-r.owed+r.paid;
  if(rows.filter(r=>r.id!=='jean').every(r=>balance(r)===0)&&Math.abs(balance(jean))<=1){
   jean.owed+=balance(jean);
  }
 }
 return rows.map(r=>({...r,owed:euros(r.owed),advanced:euros(r.advanced),paid:euros(r.paid),balance:euros(r.advanced-r.owed+r.paid)}));
}
// Keep the original transfer visible after payments have been recorded.
// A row's pre-payment balance is its current balance minus net payments.
function settlementSummary(r){
 const initialCents=cents(r.balance)-cents(r.paid);
 const remainingCents=cents(r.balance);
 const paidCents=cents(r.paid);
 const from=initialCents<0?r.name:'Jean-Noël';
 const to=initialCents<0?'Jean-Noël':r.name;
 const fullyPaid=remainingCents===0;
 const noOperation=initialCents===0&&paidCents===0;
 if(noOperation)return `<p>${esc(r.name)} : <strong class="good">${language==='nl'?'Geen betaling nodig':'Aucun règlement nécessaire'}</strong></p>`;
 const detail=`${esc(from)} → ${esc(to)} : <strong>${fmt(euros(Math.abs(initialCents)))}</strong>`;
 const paidInfo=paidCents!==0?` <span class="muted">· ${language==='nl'?'Betaald':'Payé'} : ${fmt(euros(Math.abs(paidCents)))}</span>`:'';
 const status=fullyPaid?` <strong class="good">· ${language==='nl'?'Vereffend':'Soldé'}</strong>`:` <span class="muted">· ${language==='nl'?'Nog te betalen':'Reste à payer'} : ${fmt(euros(Math.abs(remainingCents)))}</span>`;
 const action=!fullyPaid&&admin()?` <button class="small" onclick="settleBalance('${r.id}')">${language==='nl'?'Als betaald markeren':'Marquer comme payé'}</button>`:'';
 return `<p>${detail}${paidInfo}${status}${action}</p>`;
}

// Creates/updates the record first, then uploads selected attachments against its real UUID.
// If an upload fails, the saved record remains and the error identifies the failure.
async function writeWithAttachments(table,row,edit,form,linkField){
 if(!admin())return say(language==='nl'?'Alleen-lezen toegang.':'Accès en lecture seule.',true);
 const files=[...(form.elements.namedItem('new_documents')?.files||[])];
 for(const f of files){
  if(f.size===0||f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type))
   return say(language==='nl'?'Alleen PDF, JPG of PNG, maximaal 10 MB per bestand.':'PDF, JPG ou PNG uniquement, maximum 10 Mo par fichier.',true);
 }
 busy(language==='nl'?'Opslaan…':'Enregistrement…');
 try{
  const query=edit?sb.from(table).update(row).eq('id',edit):sb.from(table).insert(row);
  const result=await query.select('id');check(result.error);
  const recordId=result.data?.[0]?.id;
  if(!recordId)throw Error(language==='nl'?'Opslaan niet toegestaan.':'Enregistrement non autorisé.');
  let uploaded=0;
  for(const f of files){
   const key=`${linkField}/${recordId}/${id()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
   const store=await sb.storage.from('copro-documents').upload(key,f,{contentType:f.type,upsert:false});
   if(store.error){await refresh();throw Error(`${uploaded}/${files.length} document(s) ajouté(s). ${f.name} : ${store.error.message}`)}
   const doc=await sb.from('documents').insert({file_name:f.name,storage_path:key,mime_type:f.type,size_bytes:f.size,[linkField]:recordId});
   if(doc.error){await sb.storage.from('copro-documents').remove([key]);await refresh();throw Error(`${uploaded}/${files.length} document(s) ajouté(s). ${f.name} : ${doc.error.message}`)}
   uploaded++;
  }
  editing=null;await refresh();
 }catch(err){say((language==='nl'?'Gegevens kunnen al opgeslagen zijn; controleer de documenten. ':'Les données peuvent déjà être enregistrées ; vérifiez les documents. ')+err.message,true)}
 finally{busy('')}
}

function localizeUI(){
 document.documentElement.lang=language;
 const sel=$('lang');if(sel)sel.value=language;
 const root=document.body;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){const el=node.parentElement;if(!el||el.closest('.note-body,textarea,option[value="fr"],option[value="nl"],script,style,.doc'))continue;
 const raw=node.nodeValue,trim=raw.trim();if(!trim)continue;
 // Keep original source label to make switching languages reversible.
 if(node.__sourceLabel===undefined)node.__sourceLabel=trim;
 const source=node.__sourceLabel;
 const lookup=language==='nl'?UI_NL:UI_FR;
 let translated=lookup[source];
 if(translated===undefined){
   // Match fixed bilingual fragments that occur with a colon or within an amount line.
   translated=source;
   for(const [fr,nl] of Object.entries(lookup).sort((a,b)=>b[0].length-a[0].length)){
     if(fr.includes(' / ')&&translated.includes(fr))translated=translated.split(fr).join(nl);
   }
 }
 if(translated!==undefined)node.nodeValue=raw.replace(trim,translated);
 }
}
