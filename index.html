<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma Copro · Blankenberge v1.6</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#172438;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#173b63;color:white;padding:19px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 16px}.wrap{max-width:1200px;margin:20px auto;padding:0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{background:#1966a8;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-size:15px}button:hover{filter:brightness(.93)}button.secondary{background:#e8f0f8;color:#21466c}button.danger{background:#a82c43}button:disabled{opacity:.5;cursor:not-allowed}nav button{background:white;color:#16476e;border:1px solid #d4e1ef}nav button.active{background:#1966a8;color:white}.panel{background:white;border:1px solid #dce6ef;border-radius:15px;padding:22px;margin:16px 0;box-shadow:0 4px 14px #142c4610}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}label{display:block;font-weight:650;font-size:14px;margin:0 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #c9d8e7;border-radius:9px;font:inherit;background:white;color:#172438}textarea{min-height:85px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:15px}.muted{color:#60748a;font-size:14px}.notice{padding:12px 16px;background:#fff3dc;border-radius:9px;margin:14px 0}.good{color:#17714a}.bad{color:#a82c43}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5ebf2}th{background:#eff4f9}.num{text-align:right;white-space:nowrap}.small{font-size:12px;padding:6px 9px}.doc{display:inline-flex;align-items:center;gap:7px;margin:4px;padding:8px;background:#eff5fb;border-radius:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{padding:14px;background:#eff5fb;border-radius:9px}.metric strong{display:block;font-size:21px;margin-top:5px}footer{text-align:center;color:#64788d;padding:30px}.hidden{display:none!important}#login{max-width:470px;margin:65px auto}.topright{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#busy{font-weight:600;color:#1966a8}#message{margin:12px 0}
</style></head><body><header><div><h1>🏢 Ma Copro</h1><small>Blankenberge · Gestion partagée des comptes</small></div><div class="topright"><select id="lang" style="width:auto" onchange="language=this.value;render()"><option value="fr">Français</option><option value="nl">Nederlands</option></select><span id="identity"></span><button id="logout" class="secondary hidden" onclick="signOut()">Déconnexion</button></div></header><main class="wrap"><div id="message"></div><section id="login" class="panel"><h2>Connexion / Aanmelden</h2><form onsubmit="signIn(event)"><label>Adresse e-mail / E-mailadres</label><input id="email" type="email" autocomplete="username" required><label style="margin-top:15px">Mot de passe / Wachtwoord</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button>Se connecter / Aanmelden</button></div></form><p class="muted">Accès réservé aux copropriétaires autorisés.</p></section><section id="main" class="hidden"><div class="actions"><label style="margin:0" for="year">Exercice / Boekjaar</label><select id="year" style="width:auto" onchange="year=Number(this.value);renderPanel()"></select><span id="busy"></span></div><nav id="nav"></nav><div id="panel"></div></section></main><footer>Ma Copro v1.6 · 01/09 – 31/08 · Vérifiez les décomptes avant validation</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const URL_PROJECT='https://xxpaxhvchrflvzhtsspp.supabase.co';
const PUBLIC_KEY='sb_publishable_Sh166YmP0V3M7-8aZLgbhA_EHlI_3cz';
const sb=window.supabase?.createClient(URL_PROJECT,PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const PEOPLE=[{id:'jean',name:'Jean-Noël',share:20},{id:'suzanne',name:'Suzanne',share:28},{id:'emma',name:'Emma',share:27},{id:'saskia',name:'Saskia',share:15},{id:'jean-marc',name:'Jean-Marc',share:10}];
const T={fr:['Électricité','Eau','Extincteurs','Dépenses diverses','Devis à valider','Décompte final'],nl:['Elektriciteit','Water','Brandblussers','Diverse uitgaven','Offertes ter goedkeuring','Eindafrekening']};
let language='fr',tab='electricity',year=new Date().getMonth()>=8?new Date().getFullYear():new Date().getFullYear()-1,role='reader',profile='',data={expenses:[],electricity_statements:[],settlements:[],quotes:[],documents:[]},editing=null;
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('fr-BE',{style:'currency',currency:'EUR'}),n=x=>Number(x)||0,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID(),dateYear=s=>Number(String(s).slice(0,4))-(Number(String(s).slice(5,7))<9?1:0),inYear=s=>dateYear(s)===year,admin=()=>role==='admin',who=k=>PEOPLE.find(p=>p.id===k)?.name||k;
function say(msg,error=false){$('message').innerHTML=msg?`<div class="notice" style="${error?'background:#ffe3e6':''}">${esc(msg)}</div>`:''}function busy(s){$('busy').textContent=s||''}function check(error){if(error)throw error}function share(owner,allocation){let p=PEOPLE.find(p=>p.id===owner);if(!p)return 0;return allocation==='garage'?(owner==='jean-marc'?1:0):allocation==='four'?(owner==='jean-marc'?0:p.share/90):p.share/100}
async function signIn(e){e.preventDefault();try{if(!sb)throw Error('La bibliothèque Supabase ne s’est pas chargée. Vérifiez votre connexion Internet.');let {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});check(error);$('password').value='';await start()}catch(err){say(err.message,true)}}
async function signOut(){await sb.auth.signOut();role='reader';profile='';$('login').classList.remove('hidden');$('main').classList.add('hidden');$('logout').classList.add('hidden');$('identity').textContent='';say('')}
async function start(){try{const {data:{user},error}=await sb.auth.getUser();check(error);if(!user){$('login').classList.remove('hidden');return}const p=await sb.from('profiles').select('role,display_name').eq('user_id',user.id).single();check(p.error);role=p.data.role;profile=p.data.display_name;$('identity').textContent=`${profile} · ${role}`;$('logout').classList.remove('hidden');$('login').classList.add('hidden');$('main').classList.remove('hidden');$('year').innerHTML=Array.from({length:15},(_,i)=>2020+i).map(y=>`<option value="${y}">${y}–${y+1} (01/09–31/08)</option>`).join('');$('year').value=year;await refresh()}catch(err){say('Connexion impossible : '+err.message,true)}}
async function refresh(){busy('Synchronisation…');try{for(const table of Object.keys(data)){let r=await sb.from(table).select('*');check(r.error);data[table]=r.data}say('');render()}catch(err){say('Erreur de synchronisation : '+err.message,true)}finally{busy('')}}
function render(){const tabs=['electricity','water','fire','divers','quotes','reports'];$('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';editing=null;render()">${T[language][i]}</button>`).join('');renderPanel()}
function renderPanel(){let out=tab==='electricity'?electricityPanel():['water','fire','divers'].includes(tab)?expensesPanel():tab==='quotes'?quotesPanel():reportsPanel();$('panel').innerHTML=out}
const opts=(items,selected)=>items.map(([v,label])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(label)}</option>`).join('');const owners=selected=>opts(PEOPLE.map(p=>[p.id,p.name]),selected);const alloc=selected=>opts([['all','5 copropriétaires / 5 mede-eigenaars'],['four','4 copropriétaires hors garage / zonder garage'],['garage','Garage uniquement / alleen garage']],selected);
const docs=({expense_id=null,electricity_id=null,quote_id=null})=>{let found=data.documents.filter(d=>expense_id?d.expense_id===expense_id:electricity_id?d.electricity_id===electricity_id:d.quote_id===quote_id);return found.map(d=>`<span class="doc">📎 ${esc(d.file_name)} <button class="small secondary" onclick="openDoc('${d.id}')">Ouvrir / Openen</button>${admin()?`<button class="small danger" onclick="deleteDoc('${d.id}')">×</button>`:''}</span>`).join('')||'<span class="muted">Aucun document / Geen document</span>'};
function uploadWidget(type,ref){return admin()?`<div class="actions"><input style="max-width:330px" type="file" id="file-${ref}" multiple accept=".pdf,.jpg,.jpeg,.png"><button class="secondary" onclick="upload('${type}','${ref}')">Joindre des documents / Documenten toevoegen</button></div><p class="muted">PDF, JPG, PNG · 10 Mo maximum par fichier.</p>`:''}
function expensesPanel(){const cat=tab==='water'?'water':tab==='fire'?'fire':'divers',list=data.expenses.filter(x=>x.category===cat&&inYear(x.expense_date)),e=editing?list.find(x=>x.id===editing)||{}:{};let title=T[language][['water','fire','divers'].indexOf(tab)+1];let form=admin()?`<section class="panel"><h2>${editing?'Modifier / Wijzigen':'Ajouter / Toevoegen'} · ${title}</h2><form onsubmit="saveExpense(event)"><div class="fields"><div><label>Date / Datum</label><input type="date" name="date" required value="${esc(e.expense_date||`${year+1}-08-01`)}"></div><div><label>Objet / Omschrijving</label><input name="title" required value="${esc(e.title||'')}"></div><div><label>Montant TTC / Bedrag incl. btw (€)</label><input name="amount" type="number" min="0.01" step="0.01" required value="${e.amount_ttc??''}"></div><div><label>Payé par / Betaald door</label><select name="payer">${owners(e.paid_by||'jean')}</select></div><div><label>Répartition / Verdeling</label><select name="allocation">${alloc(e.allocation||(cat==='fire'?'four':'all'))}</select></div>${cat==='divers'?`<div><label>Catégorie / Categorie</label><select name="subcategory">${opts(['Travaux','Assurance','Entretien','Administration','Consommations','Autre'].map(x=>[x,x]),e.subcategory||'Autre')}</select></div>`:''}</div><label>Remarques / Opmerkingen</label><textarea name="notes">${esc(e.notes||'')}</textarea><div class="actions"><button>${editing?'Enregistrer':'Ajouter la dépense'}</button>${editing?'<button type="button" class="secondary" onclick="editing=null;renderPanel()">Annuler</button>':''}</div></form></section>`:'';
let rows=PEOPLE.map(p=>({name:p.name,amount:list.reduce((s,x)=>s+n(x.amount_ttc)*share(p.id,x.allocation),0)}));return form+`<section class="panel"><h2>${title} · ${fmt(list.reduce((s,x)=>s+n(x.amount_ttc),0))}</h2>${summary(rows)}${list.map(x=>`<div style="border-top:1px solid #e4ebf2;padding:14px 0"><strong>${esc(x.title)}</strong> · ${esc(x.expense_date)} · ${fmt(x.amount_ttc)}<p class="muted">${esc(who(x.paid_by))} · ${esc(x.subcategory||'')} · ${esc(x.notes||'')}</p>${docs({expense_id:x.id})}${uploadWidget('expense_id',x.id)}${admin()?`<div class="actions"><button class="secondary small" onclick="editing='${x.id}';renderPanel()">Modifier</button><button class="danger small" onclick="removeRow('expenses','${x.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class="muted">Aucune dépense / Geen uitgaven</p>'}</section>`}
function summary(rows){return `<div class="summary">${rows.map(r=>`<div class="metric">${esc(r.name)}<strong>${fmt(r.amount)}</strong></div>`).join('')}</div>`}
async function saveExpense(ev){ev.preventDefault();let f=ev.target,v=Object.fromEntries(new FormData(f));if(!inYear(v.date))return say('Date hors exercice.',true);let row={expense_date:v.date,title:v.title,amount_ttc:n(v.amount),paid_by:v.payer,allocation:v.allocation,category:tab==='water'?'water':tab==='fire'?'fire':'divers',subcategory:v.subcategory||null,notes:v.notes||null};await write('expenses',row,editing)}
function electricityPanel(){let list=data.electricity_statements.filter(x=>inYear(x.statement_date)),e=editing?list.find(x=>x.id===editing)||{}:{};let form=admin()?`<section class="panel"><h2>${editing?'Modifier':'Ajouter'} un décompte électrique / Elektriciteitsafrekening</h2><p class="muted">Total annuel TTC = acomptes + régularisation. Le coût de chaque décompteur est calculé séparément par règle de trois.</p><form onsubmit="saveElectricity(event)"><div class="fields"><div><label>Date de régularisation</label><input type="date" name="date" required value="${esc(e.statement_date||`${year+1}-08-15`)}"></div><div><label>Acomptes annuels (€)</label><input type="number" name="advances" step="0.01" min="0" required value="${e.annual_total_ttc??''}"></div><div><label>Régularisation (+ / −) (€)</label><input type="number" name="adjustment" step="0.01" required value="0"></div><div><label>Consommation totale facture (kWh)</label><input type="number" name="total" step="0.001" min="0.001" required value="${e.total_kwh??''}"></div><div><label>Décompteur communs (kWh)</label><input type="number" name="common" step="0.001" min="0" required value="${e.common_kwh??''}"></div><div><label>Décompteur garage (kWh)</label><input type="number" name="garage" step="0.001" min="0" required value="${e.garage_kwh??''}"></div></div><label>Remarques</label><textarea name="notes">${esc(e.notes||'')}</textarea><div class="actions"><button>Enregistrer / Opslaan</button>${editing?'<button type="button" class="secondary" onclick="editing=null;renderPanel()">Annuler</button>':''}</div></form></section>`:'';
let rows=PEOPLE.map(p=>({name:p.name,amount:list.reduce((s,x)=>s+(n(x.annual_total_ttc)*n(x.common_kwh)/n(x.total_kwh))*share(p.id,'four')+(p.id==='jean-marc'?n(x.annual_total_ttc)*n(x.garage_kwh)/n(x.total_kwh):0),0)}));return form+`<section class="panel"><h2>Électricité / Elektriciteit</h2>${summary(rows)}${list.map(x=>`<div style="padding:15px 0;border-top:1px solid #ddd"><strong>${esc(x.statement_date)}</strong> · Facture TTC ${fmt(x.annual_total_ttc)} · ${x.total_kwh} kWh<p>Communs ${x.common_kwh} kWh = ${fmt(n(x.annual_total_ttc)*n(x.common_kwh)/n(x.total_kwh))} · Garage ${x.garage_kwh} kWh = ${fmt(n(x.annual_total_ttc)*n(x.garage_kwh)/n(x.total_kwh))}</p>${docs({electricity_id:x.id})}${uploadWidget('electricity_id',x.id)}${admin()?`<div class="actions"><button class="secondary small" onclick="editing='${x.id}';renderPanel()">Modifier</button><button class="danger small" onclick="removeRow('electricity_statements','${x.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class="muted">Aucun décompte / Geen afrekening</p>'}</section>`}
async function saveElectricity(ev){ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target)),total=n(v.total),common=n(v.common),garage=n(v.garage),annual=n(v.advances)+n(v.adjustment);if(!inYear(v.date)||annual<0||total<=0||common<0||garage<0||common+garage>total)return say('Vérifiez les dates, montants et consommations.',true);let row={statement_date:v.date,period_start:`${year}-09-01`,period_end:`${year+1}-08-31`,annual_total_ttc:annual,total_kwh:total,common_kwh:common,garage_kwh:garage,paid_by:'jean',notes:v.notes||null};await write('electricity_statements',row,editing)}
function quotesPanel(){let list=data.quotes.filter(x=>inYear(x.received_date)),e=editing?list.find(x=>x.id===editing)||{}:{};let form=admin()?`<section class="panel"><h2>Devis à valider / Offertes ter goedkeuring</h2><form onsubmit="saveQuote(event)"><div class="fields"><div><label>Date</label><input type="date" name="date" required value="${esc(e.received_date||`${year+1}-08-01`)}"></div><div><label>Entreprise / Onderneming</label><input name="vendor" required value="${esc(e.vendor||'')}"></div><div><label>Objet / Onderwerp</label><input name="title" required value="${esc(e.title||'')}"></div><div><label>Montant TTC (€)</label><input name="amount" type="number" min="0" step="0.01" required value="${e.amount_ttc??''}"></div><div><label>Statut / Status</label><select name="status">${opts([['pending','À examiner'],['approved','Approuvé'],['rejected','Refusé'],['postponed','Reporté']],e.status||'pending')}</select></div></div><label>Remarques</label><textarea name="notes">${esc(e.notes||'')}</textarea><div class="actions"><button>Enregistrer</button>${editing?'<button type="button" class="secondary" onclick="editing=null;renderPanel()">Annuler</button>':''}</div></form></section>`:'';return form+`<section class="panel"><h2>Devis / Offertes (${list.length})</h2><p class="muted">Les devis ne sont pas comptabilisés comme dépenses.</p>${list.map(x=>`<div style="border-top:1px solid #ddd;padding:15px 0"><strong>${esc(x.title)}</strong> · ${fmt(x.amount_ttc)} · ${esc(x.status)}<p>${esc(x.vendor)} · ${esc(x.received_date)} · ${esc(x.notes||'')}</p>${docs({quote_id:x.id})}${uploadWidget('quote_id',x.id)}${admin()?`<div class="actions"><button class="secondary small" onclick="editing='${x.id}';renderPanel()">Modifier</button><button class="danger small" onclick="removeRow('quotes','${x.id}')">Supprimer</button></div>`:''}</div>`).join('')||'<p class="muted">Aucun devis / Geen offertes</p>'}</section>`}
async function saveQuote(ev){ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target));if(!inYear(v.date))return say('Date hors exercice.',true);await write('quotes',{received_date:v.date,vendor:v.vendor,title:v.title,amount_ttc:n(v.amount),status:v.status,notes:v.notes||null},editing)}
function paymentsPanel(){let list=data.settlements.filter(x=>inYear(x.payment_date));return (admin()?`<section class="panel"><h2>Enregistrer un remboursement / Terugbetaling registreren</h2><form onsubmit="savePayment(event)"><div class="fields"><div><label>Date</label><input type="date" name="date" required value="${year+1}-08-31"></div><div><label>De / Van</label><select name="from">${owners('suzanne')}</select></div><div><label>Vers / Naar</label><select name="to">${owners('jean')}</select></div><div><label>Montant (€)</label><input type="number" name="amount" min="0.01" step="0.01" required></div></div><label>Remarques</label><textarea name="notes"></textarea><div class="actions"><button>Enregistrer</button></div></form></section>`:'')+`<section class="panel"><h2>Remboursements / Terugbetalingen</h2>${list.map(x=>`<p>${esc(x.payment_date)} · ${esc(who(x.from_owner))} → ${esc(who(x.to_owner))} · <strong>${fmt(x.amount)}</strong> ${admin()?`<button class="danger small" onclick="removeRow('settlements','${x.id}')">Supprimer</button>`:''}</p>`).join('')||'<p class="muted">Aucun remboursement</p>'}</section>`}
async function savePayment(ev){ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target));if(!inYear(v.date)||v.from===v.to||(v.from!=='jean'&&v.to!=='jean'))return say('Les remboursements doivent passer par Jean-Noël, entre deux copropriétaires distincts.',true);await write('settlements',{payment_date:v.date,from_owner:v.from,to_owner:v.to,amount:n(v.amount),notes:v.notes||null})}
function ledger(){let rows=PEOPLE.map(p=>({...p,owed:0,advanced:0,paid:0}));for(const x of data.expenses.filter(x=>inYear(x.expense_date))){let payer=rows.find(r=>r.id===x.paid_by);if(payer)payer.advanced+=n(x.amount_ttc);for(let r of rows)r.owed+=n(x.amount_ttc)*share(r.id,x.allocation)}for(const x of data.electricity_statements.filter(x=>inYear(x.statement_date))){let total=n(x.annual_total_ttc),common=total*n(x.common_kwh)/n(x.total_kwh),garage=total*n(x.garage_kwh)/n(x.total_kwh);rows[0].advanced+=common+garage;for(let r of rows)r.owed+=common*share(r.id,'four')+(r.id==='jean-marc'?garage:0)}for(const x of data.settlements.filter(x=>inYear(x.payment_date))){let from=rows.find(r=>r.id===x.from_owner),to=rows.find(r=>r.id===x.to_owner);if(from)from.paid+=n(x.amount);if(to)to.paid-=n(x.amount)}return rows.map(r=>({...r,balance:r.advanced-r.owed+r.paid}))}
function reportsPanel(){let rows=ledger(),others=rows.filter(r=>r.id!=='jean');return `<section class="panel"><h2>Décompte final / Eindafrekening · ${year}–${year+1}</h2><div class="tablewrap"><table><thead><tr><th>Copropriétaire</th><th class="num">Charges</th><th class="num">Avances payées</th><th class="num">Règlements</th><th class="num">Solde</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)} (${r.share} %)</td><td class="num">${fmt(r.owed)}</td><td class="num">${fmt(r.advanced)}</td><td class="num">${fmt(r.paid)}</td><td class="num">${fmt(r.balance)}</td></tr>`).join('')}</tbody></table></div><h2 style="margin-top:25px">Règlements via Jean-Noël / Betalingen via Jean-Noël</h2>${others.map(r=>`<p>${r.balance<-.005?`${esc(r.name)} → Jean-Noël`:`Jean-Noël → ${esc(r.name)}`} : <strong>${fmt(Math.abs(r.balance))}</strong>${Math.abs(r.balance)<.005?' (soldé)':''}</p>`).join('')}<p class="muted">Les soldes sont calculés à partir des factures et remboursements enregistrés. Les devis sont exclus.</p><button class="secondary" onclick="window.print()">Imprimer / PDF</button></section>${paymentsPanel()}`}
async function write(table,row,edit){if(!admin())return say('Accès en lecture seule.',true);busy('Enregistrement…');try{let q=edit?sb.from(table).update(row).eq('id',edit):sb.from(table).insert(row);let r=await q.select();check(r.error);editing=null;await refresh()}catch(err){say('Enregistrement impossible : '+err.message,true)}finally{busy('')}}
async function removeRow(table,key){if(!admin()||!confirm('Supprimer définitivement cet élément et ses pièces jointes ?'))return;busy('Suppression…');try{let linked=table==='expenses'?'expense_id':table==='electricity_statements'?'electricity_id':table==='quotes'?'quote_id':null;if(linked){for(const d of data.documents.filter(d=>d[linked]===key)){check((await sb.storage.from('copro-documents').remove([d.storage_path])).error)}}check((await sb.from(table).delete().eq('id',key)).error);await refresh()}catch(e){say('Suppression impossible : '+e.message,true)}finally{busy('')}}
async function upload(type,ref){if(!admin())return;let input=$(`file-${ref}`),files=[...input.files];if(!files.length)return say('Choisissez un fichier.',true);busy('Envoi des documents…');try{for(const f of files){if(f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type))throw Error('PDF, JPG, PNG uniquement, maximum 10 Mo.');let key=`${type}/${ref}/${id()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;check((await sb.storage.from('copro-documents').upload(key,f,{contentType:f.type,upsert:false})).error);let r=await sb.from('documents').insert({file_name:f.name,storage_path:key,mime_type:f.type,size_bytes:f.size,[type]:ref});if(r.error){await sb.storage.from('copro-documents').remove([key]);throw r.error}}await refresh()}catch(e){say('Envoi impossible : '+e.message,true)}finally{busy('')}}
async function openDoc(docid){let d=data.documents.find(x=>x.id===docid);if(!d)return;try{let r=await sb.storage.from('copro-documents').createSignedUrl(d.storage_path,120);check(r.error);window.open(r.data.signedUrl,'_blank','noopener')}catch(e){say('Document inaccessible : '+e.message,true)}}
async function deleteDoc(docid){if(!admin()||!confirm('Supprimer ce document ?'))return;let d=data.documents.find(x=>x.id===docid);try{check((await sb.storage.from('copro-documents').remove([d.storage_path])).error);check((await sb.from('documents').delete().eq('id',docid)).error);await refresh()}catch(e){say('Suppression impossible : '+e.message,true)}}
if(!sb)say('Impossible de charger Supabase. Une connexion Internet est nécessaire.',true);else start();
</script></body></html>
